<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AInterceptor — Log in to __PROVIDER__</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif;
         background: #0a0a0a; color: #e6e6e6; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid #1f1f1f;
           display: flex; align-items: center; gap: 14px; background: #0f0f0f; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  header .badge { background: #1d4ed8; color: #fff; font-size: 11px; font-weight: 700;
                  padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
  header .logout { margin-left: auto; color: #888; text-decoration: none; font-size: 12px; }
  header .logout:hover { color: #fff; }
  iframe { flex: 1; width: 100%; border: 0; display: block; min-height: 600px; }
  .hint { padding: 8px 20px; font-size: 12px; color: #888;
          background: #0f0f0f; border-bottom: 1px solid #1f1f1f; }
  .gate { max-width: 380px; margin: 12vh auto; padding: 32px;
          background: #111; border: 1px solid #222; border-radius: 8px; }
  .gate h2 { margin: 0 0 6px; font-size: 20px; }
  .gate p { margin: 0 0 20px; color: #888; font-size: 13px; }
  .gate input[type=password] { width: 100%; padding: 11px 13px; font-size: 14px;
          background: #0a0a0a; color: #fff; border: 1px solid #333; border-radius: 6px; outline: none; }
  .gate input[type=password]:focus { border-color: #1d4ed8; }
  .gate button { width: 100%; margin-top: 14px; padding: 11px;
          background: #1d4ed8; color: #fff; border: 0; border-radius: 6px;
          font-size: 14px; font-weight: 600; cursor: pointer; }
  .gate button:hover { background: #2563eb; }
  .gate .err { color: #f87171; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
__BODY__
</body>
</html>
