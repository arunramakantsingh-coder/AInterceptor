[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ainterceptor"
version = "0.2.0"
description = "AInterceptor AIRouter control-plane CLI"
requires-python = ">=3.12"
dependencies = [
  "prompt-toolkit>=3.0",
]

[tool.setuptools.package-dir]
"" = "."
app = "backend/app"

[tool.setuptools]
packages = [
  "cli",
  "app",
  "app.api",
  "app.gateway",
  "app.interception",
  "app.orchestrator",
  "app.providers",
]

[project.scripts]
bootai = "cli.main:main"
airouter = "cli.main:main"
